<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <canvas id="myCanvas" width="600" height="300" style="border: black 1px solid;"></canvas>
    <script>
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        ctx.moveTo(0, 0);
        ctx.lineTo(600, 300);
        ctx.stroke();
        ctx.moveTo(600, 0);
        ctx.lineTo(0,300);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(300, 150, 100, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.font = "30px Arial";
        ctx.strokeText("Hello World", 300, 150);
    </script>
</body>
</html>
